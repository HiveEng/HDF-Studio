name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Collect installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { Copy-Item $_ "out/HDF-Studio-Setup.exe" }
          Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | ForEach-Object { Copy-Item $_ "out/HDF-Studio.msi" }
          Get-ChildItem out
      - uses: actions/upload-artifact@v5
        with:
          name: HDF-Studio-Windows
          path: out/*
      # Every push to main refreshes the "Latest build" pre-release; a v* tag makes a proper release.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          # GitHub's release API sometimes answers 500 right after a delete; retry a few times.
          for i in 1 2 3 4 5; do
            gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest build ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
              --notes "Built automatically from main at ${GITHUB_SHA::7}. Download HDF-Studio-Setup.exe to install for your Windows account (no admin rights needed), or HDF-Studio.msi for IT deployment. The installer isn't code-signed yet: if Windows shows 'Windows protected your PC', choose More info, then Run anyway." \
              && gh release upload latest out/* --clobber && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "HDF Studio ${GITHUB_REF_NAME#v}" --generate-notes

