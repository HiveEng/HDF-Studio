name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Every build gets its own version (0.1.<run number>) so installed copies can tell it's newer.
      # With the signing key secret set, the build also makes signed update packages.
      - name: Set version and updater signing
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e '
            const fs = require("fs"), p = "src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = "0.1." + process.env.GITHUB_RUN_NUMBER;
            c.bundle.createUpdaterArtifacts = process.env.HAS_KEY === "true";
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("version", c.version, "updater artifacts", c.bundle.createUpdaterArtifacts);'
      - run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          exe=$(ls src-tauri/target/release/bundle/nsis/*.exe | head -1)
          cp "$exe" out/HDS-Setup.exe
          cp src-tauri/target/release/bundle/msi/*.msi out/HDS.msi
          if [ -f "$exe.sig" ]; then
            node -e '
              const fs = require("fs");
              const c = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
              fs.writeFileSync("out/latest.json", JSON.stringify({
                version: c.version,
                notes: "Built from " + process.env.GITHUB_SHA.slice(0, 7),
                pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": {
                  signature: fs.readFileSync(process.argv[1], "utf8").trim(),
                  url: "https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/latest/HDS-Setup.exe" } }
              }, null, 2));' "$exe.sig"
          fi
          ls -la out
      - uses: actions/upload-artifact@v5
        with:
          name: HDS-Windows
          path: out/*
      # Every push to main refreshes the "Latest build" pre-release; a v* tag makes a proper release.
      - name: Publish latest build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          # GitHub's release API sometimes answers 500 right after a delete; retry a few times.
          for i in 1 2 3 4 5; do
            gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --target "$GITHUB_SHA" \
              --title "Latest build 0.1.${GITHUB_RUN_NUMBER} ($(date -u +%Y-%m-%d) ${GITHUB_SHA::7})" \
              --notes "Built automatically from main at ${GITHUB_SHA::7}. Download HDS-Setup.exe to install HDS (Hive Document Studio) for your Windows account (no admin rights needed), or HDS.msi for IT deployment. The installer isn't code-signed yet: if Windows shows 'Windows protected your PC', choose More info, then Run anyway." \
              && gh release upload latest out/* --clobber && exit 0
            sleep $((i * 10))
          done
          exit 1
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "HDS ${GITHUB_REF_NAME#v}" --generate-notes

