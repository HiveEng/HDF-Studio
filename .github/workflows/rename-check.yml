# Temporary: checks that an installed HDF Studio updates cleanly to HDS. Remove before merging.
name: Rename upgrade check

on:
  push:
    branches: [claude/project-thread-1oqh2j]

jobs:
  upgrade:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build HDS installers
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), p = "src-tauri/tauri.conf.json", c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = "0.1.999"; c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));'
          npx tauri build
          ls -la src-tauri/target/release/bundle/nsis src-tauri/target/release/bundle/msi
      - name: Install the current HDF Studio, then update it to HDS the way the app does
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/latest/HDF-Studio-Setup.exe" -OutFile old-setup.exe
          Start-Process -Wait -FilePath .\old-setup.exe -ArgumentList "/S"
          $old = Join-Path $env:LOCALAPPDATA "HDF Studio"
          "--- old install"; Get-ChildItem $old | Format-Table Name, Length
          Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HDF Studio" | Format-List DisplayName, DisplayVersion, MainBinaryName, InstallLocation
          $sm = [Environment]::GetFolderPath("Programs"); $desk = [Environment]::GetFolderPath("Desktop")
          $pins = Join-Path $env:APPDATA "Microsoft\Internet Explorer\Quick Launch\User Pinned\TaskBar"
          New-Item -ItemType Directory -Force $pins | Out-Null
          Copy-Item (Join-Path $sm "HDF Studio.lnk") (Join-Path $pins "HDF Studio.lnk")
          "start menu: $(Test-Path (Join-Path $sm 'HDF Studio.lnk'))  desktop: $(Test-Path (Join-Path $desk 'HDF Studio.lnk'))"
          $exe = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HDF Studio").MainBinaryName
          if (-not $exe) { $exe = "HDF Studio.exe" }
          $p = Start-Process -FilePath (Join-Path $old $exe) -PassThru
          Start-Sleep 8
          "old app running: $(-not $p.HasExited)"

          $new = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe | Select-Object -First 1
          "--- running $($new.Name) /UPDATE /P"
          Start-Process -Wait -FilePath $new.FullName -ArgumentList "/UPDATE", "/P"
          Start-Sleep 2

          $fail = @()
          $hds = Join-Path $env:LOCALAPPDATA "HDS"
          "--- new install"; Get-ChildItem $hds | Format-Table Name, Length
          if (-not (Test-Path (Join-Path $hds "HDS.exe"))) { $fail += "HDS.exe missing" }
          if (Test-Path (Join-Path $old $exe)) { $fail += "old exe still there" }
          if (Test-Path $old) { $fail += "old folder still there" }
          if (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HDF Studio") { $fail += "old Add/Remove entry still there" }
          if (-not (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HDS")) { $fail += "HDS Add/Remove entry missing" }
          Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\HDS" | Format-List DisplayName, DisplayVersion, MainBinaryName, InstallLocation
          if (Test-Path (Join-Path $sm "HDF Studio.lnk")) { $fail += "old Start menu shortcut still there" }
          if (-not (Test-Path (Join-Path $sm "HDS.lnk"))) { $fail += "HDS Start menu shortcut missing" }
          if (Test-Path (Join-Path $desk "HDF Studio.lnk")) { $fail += "old desktop shortcut still there" }
          if (-not (Test-Path (Join-Path $desk "HDS.lnk"))) { $fail += "HDS desktop shortcut missing" }
          $sh = New-Object -ComObject WScript.Shell
          foreach ($l in @((Join-Path $sm "HDS.lnk"), (Join-Path $desk "HDS.lnk"), (Join-Path $pins "HDF Studio.lnk"))) {
            if (Test-Path $l) { $t = $sh.CreateShortcut($l).TargetPath; "$l -> $t"; if ($t -notlike "*\HDS\HDS.exe") { $fail += "$l points at $t" } }
          }
          $cls = (Get-ItemProperty "HKCU:\Software\Classes\.pdf")."(default)"
          $cmd = (Get-ItemProperty "HKCU:\Software\Classes\$cls\shell\open\command")."(default)"
          ".pdf -> $cls -> $cmd"
          if ($cmd -notlike "*\HDS\HDS.exe*") { $fail += ".pdf opens with $cmd" }
          if (-not $p.HasExited) { $fail += "old app was not closed" }
          if ($fail.Count) { "FAILED:"; $fail; exit 1 }
          "All upgrade checks passed"
