<style>.lbl{fill:#1e1f20}.mut{fill:#6c6e70;font-size:12px}.ttl{font-weight:600;font-size:14px;fill:#1e1f20}.st{fill:#05C7F2}.stt{fill:#0D0D0D;font-weight:700;font-size:12px}.drw{stroke:#9a9c9e;fill:none;stroke-width:1.2}</style></defs><rect width="690" height="255" fill="#fff"/><text class="ttl" x="20" y="26" text-anchor="start" >Leaders from a text box (multileader)</text><rect x="30" y="50" width="150" height="44" fill="#fff" stroke="#d91a1a" stroke-width="1.4"/><text class="lbl" x="42" y="77" text-anchor="start" style="fill:#d91a1a">TYP. ALL DOORS</text><g stroke="#d91a1a" stroke-width="1.5" fill="none"><path d="M90 94 L70 196" marker-end="url(#ar)"/><path d="M130 94 L190 196" marker-end="url(#ar)"/><path d="M180 84 L300 186" marker-end="url(#ar)"/></g><circle class="st" cx="70" cy="211" r="11"/><text class="stt" x="70" y="215" text-anchor="middle">1</text><circle class="st" cx="190" cy="211" r="11"/><text class="stt" x="190" y="215" text-anchor="middle">2</text><circle class="st" cx="300" cy="201" r="11"/><text class="stt" x="300" y="205" text-anchor="middle">3</text><text class="mut" x="20" y="245" text-anchor="start" >Select the box, Leader (Shift+L), click each tip, then Esc</text><line x1="365" y1="20" x2="365" y2="240" stroke="#e1e3e4"/><text class="ttl" x="390" y="26" text-anchor="start" >A free leader</text><path d="M440 190 L610 80" stroke="#d91a1a" stroke-width="1.5" fill="none" marker-start="url(#ar)"/><circle class="st" cx="440" cy="190" r="11"/><text class="stt" x="440" y="194" text-anchor="middle">1</text><circle class="st" cx="610" cy="80" r="11"/><text class="stt" x="610" y="84" text-anchor="middle">2</text><text class="lbl" x="458" y="212" text-anchor="start" ><tspan font-weight="700">1</tspan>  Click the arrow tip</text><text class="lbl" x="470" y="62" text-anchor="start" ><tspan font-weight="700">2</tspan>  Click where it starts</text><text class="mut" x="390" y="245" text-anchor="start" >Leader with nothing selected</text></svg>
