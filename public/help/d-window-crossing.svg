<svg xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="13" viewBox="0 0 720 260" width="720" height="260"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d91a1a"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b6fd6"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#575859"/></marker>
<style>.lbl{fill:#1e1f20}.mut{fill:#6c6e70;font-size:12px}.ttl{font-weight:600;font-size:14px;fill:#1e1f20}.st{fill:#05C7F2}.stt{fill:#0D0D0D;font-weight:700;font-size:12px}.drw{stroke:#9a9c9e;fill:none;stroke-width:1.2}</style></defs><rect width="720" height="260" fill="#fff"/><text class="ttl" x="20" y="26" text-anchor="start" >Left to right: window</text><text class="mut" x="20" y="44" text-anchor="start" >selects what is fully inside</text><rect x="40" y="70" width="60" height="40" fill="none" stroke="#d91a1a" stroke-width="2"/><ellipse cx="150" cy="150" rx="34" ry="22" fill="none" stroke="#d91a1a" stroke-width="2"/><path d="M210 70 l60 50" stroke="#d91a1a" stroke-width="2" marker-end="url(#ar)"/><rect x="25" y="58" width="180" height="125" fill="rgba(5,120,242,.10)" stroke="#0578f2" stroke-width="1.5"/><path d="M25 200 L205 200" stroke="#0578f2" stroke-width="1.5" marker-end="url(#ab)"/><text class="lbl" x="20" y="230" text-anchor="start" >Selected: rectangle and ellipse</text><text class="mut" x="20" y="247" text-anchor="start" >The arrow sticks out, so it isn't</text><line x1="360" y1="20" x2="360" y2="250" stroke="#e1e3e4"/><text class="ttl" x="380" y="26" text-anchor="start" >Right to left: crossing</text><text class="mut" x="380" y="44" text-anchor="start" >selects anything the box touches</text><rect x="400" y="70" width="60" height="40" fill="none" stroke="#d91a1a" stroke-width="2"/><ellipse cx="510" cy="150" rx="34" ry="22" fill="none" stroke="#d91a1a" stroke-width="2"/><path d="M570 70 l60 50" stroke="#d91a1a" stroke-width="2" marker-end="url(#ar)"/><rect x="470" y="100" width="150" height="70" fill="rgba(26,160,60,.10)" stroke="#1aa03c" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M620 200 L470 200" stroke="#1aa03c" stroke-width="1.5" marker-end="url(#ag)"/><text class="lbl" x="380" y="230" text-anchor="start" >Selected: ellipse and arrow</text><text class="mut" x="380" y="247" text-anchor="start" >Both touch the box</text></svg>
